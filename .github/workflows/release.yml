name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required to create GitHub Releases + upload assets

jobs:
  release:
    name: Cross-compile + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          # Bun supports cross-compiling to all major platforms from a single runner.
          # ~30s total vs minutes of matrix queue time.
          bun build --compile --target=bun-linux-x64    --outfile=dist/dotbox-linux-x64    src/index.ts
          bun build --compile --target=bun-darwin-x64   --outfile=dist/dotbox-darwin-x64   src/index.ts
          bun build --compile --target=bun-darwin-arm64 --outfile=dist/dotbox-darwin-arm64 src/index.ts
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dotbox-*
          fail_on_unmatched_files: true
          generate_release_notes: true
