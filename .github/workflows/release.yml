name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required to create GitHub Releases + upload assets

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-13          # intel runner
            target: darwin-x64
          - os: macos-14          # apple silicon runner
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build standalone binary
        run: bun build --compile --target=bun --outfile=dist/dotbox-${{ matrix.target }} src/index.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotbox-${{ matrix.target }}
          path: dist/dotbox-${{ matrix.target }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p dist
          for f in artifacts/*/dotbox-*; do
            cp "$f" dist/
          done
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dotbox-*
          fail_on_unmatched_files: true
          generate_release_notes: true
